[package]
name = "atv-remote"
version = "0.1.3"
edition = "2024"
rust-version = "1.100"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }

serde = { version = "1", features = ["derive"] }
ratv = { git = "https://github.com/henrikwidlund/ratv", rev = "48cc6cdca0437ccaa52cba026d4759e62dbee205" }
if-addrs = "0.15"
tempfile = "3"
